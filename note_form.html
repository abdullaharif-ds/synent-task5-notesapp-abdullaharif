{% extends "base.html" %}
{% block title %}{{ 'Edit Note' if note else 'New Note' }} · Card Catalog{% endblock %}
{% block content %}

<div class="auth-wrap">
    <div class="index-card auth-card">
        <div class="card-tab">{{ 'EDIT' if note else 'NEW' }}</div>
        <h1 class="card-title">{{ 'Edit note' if note else 'New note' }}</h1>

        <form method="POST" class="stack-form">
            <label class="field-label" for="title">Title</label>
            <input class="field-input" type="text" id="title" name="title"
                   value="{{ note.title if note else '' }}" required autofocus>

            <label class="field-label" for="content">Content</label>
            <textarea class="field-input field-textarea" id="content" name="content" rows="8" required>{{ note.content if note else '' }}</textarea>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">{{ 'Save changes' if note else 'Create note' }}</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
